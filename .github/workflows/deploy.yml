name: Deploy to GitHub Pages

# Builds the Astro site in site/ and publishes it to GitHub Pages on every push
# to main (including content edits made through GitHub's web editor). The build
# step runs the bundle-assets integration, which copies ../assets into the bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages only. Skips on Gitea (which has no Pages) — Gitea runs
    # .gitea/workflows/build.yml instead. github.server_url is github.com on
    # GitHub and your Gitea instance URL on Gitea.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 22

  deploy:
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
